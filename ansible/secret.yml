---
- name: Deliver encrypted training token to own portal VMs
  hosts: portal
  become: true
  vars_files:
    - ../.runtime/training-vault.yml
  tasks:
    - name: Install private training token
      ansible.builtin.copy:
        content: '{{ training_token }}'
        dest: /etc/list-training-token
        owner: root
        group: root
        mode: '0600'
      no_log: true
